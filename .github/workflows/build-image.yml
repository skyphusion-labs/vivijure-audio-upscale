name: build-image

# Build the vivijure-audio-upscale RunPod serverless image and push it to GHCR.
#
# Unified image workflow (mirrors the slate image.yml shape): a pushed SemVer tag
# (v0.1.0) publishes the immutable, pinnable release image tagged with the clean
# version (0.1.0), the major.minor (0.1), and the short commit sha (sha-abc1234).
# A push to main that touches the image inputs still BUILDS the image as a smoke
# but does NOT push it; only a pushed version tag (or a manual workflow_dispatch)
# publishes to GHCR. A bare merge to main never publishes.
#
# :latest EXISTS and TRACKS THE NEWEST RELEASE. NOTHING MAY EVER PIN IT. RunPod
# endpoints, compose files and the connectivity-directory pin system
# (vivijure-control-plane/src/satellite-pins.ts) all pin an explicit version,
# never `latest` -- that is the real invariant this workflow can hold, not that
# the tag must not exist. This header previously read "There is NO :latest",
# which was false: docker/metadata-action defaults to `flavor: latest=auto`,
# which mints the tag on every SemVer tag push regardless of the `tags:` list
# below (currently `:latest` -> 1.1.1, this repo's newest release).
#
# `latest=auto` is KEPT DELIBERATELY. GHCR deletes by VERSION (digest), and
# :latest shares its digest with the release tag that minted it, so it cannot be
# removed without deleting that release. Setting `latest=false` now would FREEZE
# :latest at whatever version currently holds it, forever, while every later
# release ships past it -- a stale :latest is strictly more dangerous than a
# current one, since it is the tag most likely to be pulled by accident and
# would silently serve an old image. See skyphusion-labs/fleet-chezmoi#1630.
#
# Before this unification audio-upscale built on push-to-main only and published
# :latest + a full sha, so it never cut a pinnable version -- the sibling parity gap
# S1 closes.
#
# The homelab SERVE OVERLAY (Dockerfile.serve, resident LOCAL_FINISH_* door) is built and
# published by THIS SAME JOB, as `<tag>-serve` for every release tag, because its FROM is the
# release image and the ordering is therefore not optional: the base has to exist before the
# overlay can resolve it. Building it here means the base is already in the local daemon, so
# the overlay costs one thin layer instead of a second tens-of-GB pull -- and it means the
# published `<version>-serve` image and its base are always built from ONE source tree.
# Before this, nothing anywhere built a serve image: GHCR carried 28 tags for this package and
# zero `*-serve` tags, so every resident door on the fleet ran a hand-built local tag that
# nobody else could re-pull, re-verify or roll back (fc#1592, vivijure-upscale#89 item 1).
#
# Runner: GitHub-hosted ubuntu-latest. This repo is PUBLIC, so per the standing runner
# policy (public repos -> GitHub-hosted, fork-safe; private/internal -> the org fleet
# pool) the build runs in the hosted sandbox, NOT on the self-hosted fleet. The CUDA
# base (runpod/pytorch cu1281) is a tens-of-GB build; ubuntu-latest ships with only
# ~14GB free, so the "Free disk space" step below reclaims ~25-30GB of preinstalled
# toolchains this image never uses (the same pattern proven in vivijure-backend). Without
# it the docker build blows the runner disk.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - Dockerfile.serve
      - handler.py
      - requirements.txt
      - runpod_http_serve.py
      - serve.py
      - .github/workflows/build-image.yml
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # fc#1628: this guard lived on the removed sync-gpu-allowlist job, which was the
    # only thing stopping a non-tag push from baking. It moves here rather than vanishing.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    # Public repo -> GitHub-hosted (fork-safe). Self-hosted GPU runners are for private repos only.
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      IMAGE: ghcr.io/skyphusion-labs/vivijure-audio-upscale
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Assert commit is on main (no publish of an unreviewed release)
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::commit $GITHUB_SHA is not on origin/main; refusing to publish an unreviewed release"
            exit 1
          fi

      - name: Free disk space (hosted runners only; Plane C has TB-class disk)
        if: runner.environment == 'github-hosted'
        run: |
          set -eu
          echo "--- before ---"; df -h /
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-}" || true
          sudo docker image prune -af || true
          echo "--- after ---"; df -h /

      - name: Log in to GHCR
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build image
        # Plain docker build, not buildx/build-push-action -- but NOT for the reason this comment
        # used to give, which was stale and credited a control that does not run here. It said host
        # prep rewrites the local runpod/pytorch tag and buildx bypasses it (fc#754). That was true
        # while this job ran on [self-hosted, gpu]; f83375ad moved it to ubuntu-latest on
        # 2026-07-22 and did not touch this comment. prep-runpod-base-for-pip-builds.sh is a
        # /usr/local/sbin script on the Plane C bake hosts and DOES NOT EXIST on a GitHub-hosted
        # runner, so for three weeks this comment told the reader the cryptography footgun was
        # handled while nothing here handled it. It is handled in the Dockerfile now (#103), by
        # purging the OS-managed copy and asserting the shipped state.
        #
        # The real reason to stay on plain docker build is the SERVE OVERLAY below: its FROM is the
        # tag this step just built, and its CONTROL 2 requires that tag to be in the local daemon
        # rather than re-resolved from the registry.
        # meta.outputs.tags is newline-separated -- must not expand inline in `for t in …`.
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          ARGS=""
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            ARGS="$ARGS -t $t"
          done <<< "$META_TAGS"
          docker build $ARGS .

      - name: Push image
        # Publish ONLY on a version tag or a deliberate workflow_dispatch; a bare
        # merge to main builds the image above as a smoke but never pushes it.
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            docker push "$t"
          done <<< "$META_TAGS"

      - name: Build serve overlay
        # ALWAYS builds (a bare merge to main smoke-builds it exactly like the release image);
        # the push below is what is gated. Plain docker build, same reason as above: buildx
        # would re-resolve the base from the registry and bypass the local image this job just
        # produced.
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
          META_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${META_VERSION:-}" ]; then
            echo "::error::metadata-action produced no version; cannot resolve a serve base"
            exit 1
          fi
          base="${IMAGE}:${META_VERSION}"

          # CONTROL 1 -- the base must be one of the tags THIS job built. Whole-line match
          # (grep -Fxq): a substring match would accept a near-miss tag, which is the defect
          # class that keeps costing this crew real time.
          if ! printf '%s\n' "$META_TAGS" | grep -Fxq "$base"; then
            echo "::error::resolved serve base ${base} is not among the tags this job built:"
            printf '%s\n' "$META_TAGS"
            exit 1
          fi

          # CONTROL 2 -- and it must already be LOCAL. Without this, docker would silently PULL
          # a same-named tag from GHCR and build the overlay on a base that is NOT the one just
          # built. That failure has no tell: the build succeeds and the log looks identical.
          if ! docker image inspect "$base" >/dev/null 2>&1; then
            echo "::error::serve base ${base} absent locally; refusing to let docker pull a stale one"
            exit 1
          fi
          echo "serve base ${base} -> image id $(docker image inspect --format '{{.Id}}' "$base")"

          # Derive the serve tags from the release tags rather than restating them: a hand-kept
          # list forks from its source and the fork reads as authoritative.
          : > "$RUNNER_TEMP/serve-tags.txt"
          m=0
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            m=$((m + 1))
            echo "${t}-serve" >> "$RUNNER_TEMP/serve-tags.txt"
          done <<< "$META_TAGS"
          n="$(wc -l < "$RUNNER_TEMP/serve-tags.txt")"
          # DENOMINATOR -- printed, and a floor, so a zero is a harness failure and never a pass.
          echo "derived ${n} serve tags of ${m} release tags:"
          cat "$RUNNER_TEMP/serve-tags.txt"
          if [ "$m" -eq 0 ] || [ "$n" -ne "$m" ]; then
            echo "::error::derived ${n} serve tags from ${m} release tags; expected 1:1 and at least one"
            exit 1
          fi

          ARGS=""
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            ARGS="$ARGS -t $t"
          done < "$RUNNER_TEMP/serve-tags.txt"
          docker build -f Dockerfile.serve --build-arg "AUDIO_UPSCALE_IMAGE=${base}" $ARGS .

      - name: Push serve overlay
        # Same gate as the release push: only a version tag or a deliberate workflow_dispatch
        # publishes. A bare merge to main built the overlay above and stops there.
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/serve-tags.txt" ]; then
            echo "::error::serve tag list is missing or empty; the build step did not produce one"
            exit 1
          fi
          pushed=0
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            docker push "$t"
            pushed=$((pushed + 1))
          done < "$RUNNER_TEMP/serve-tags.txt"
          echo "pushed ${pushed} of $(wc -l < "$RUNNER_TEMP/serve-tags.txt") serve tags"
          [ "$pushed" -gt 0 ]

      - name: Remove local serve images to free runner disk
        if: always()
        run: |
          set -uo pipefail
          [ -s "$RUNNER_TEMP/serve-tags.txt" ] || exit 0
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            docker image rm "$t" || true
          done < "$RUNNER_TEMP/serve-tags.txt"

      - name: Remove local image to free runner disk
        if: always()
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            docker image rm "$t" || true
          done <<< "$META_TAGS"
