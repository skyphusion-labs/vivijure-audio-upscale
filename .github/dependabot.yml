version: 2

# skyphusion-labs Dependabot standard — see fleet-chezmoi/docs/runbooks/dependabot-standard.md
# PRs only (never auto-merge). Group minor/patch; majors stay separate. Peer families bump together.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    # numpy is pinned under the numba 0.66 / llvmlite<0.49 ceiling (see requirements.txt). PR #53
    # bumped numpy to >=2.5.1 and broke pip resolution (ResolutionImpossible vs numba); commit
    # 03395b4 fixed it by re-pinning numpy under that ceiling. PR #83 tried to reintroduce the
    # identical bump. Ignoring numpy>=2.5.0 here so dependabot stops proposing it; removing this
    # requires a paired numba/llvmlite bump, re-validated, not a bare numpy bump.
    ignore:
      - dependency-name: "numpy"
        versions: [">=2.5.0"]
    groups:
      pip-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
